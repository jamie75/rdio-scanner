@if (!authenticated) {
  <rdio-scanner-admin-login></rdio-scanner-admin-login>
}
@if (authenticated) {
  <rdio-scanner-admin-todos></rdio-scanner-admin-todos>
  <div class="admin-sections">
    <section class="admin-section">
      <button
        type="button"
        class="admin-section-header"
        [attr.aria-expanded]="section === 'config'"
        aria-controls="admin-config-content"
        (click)="toggleSection('config')"
      >
        <span class="admin-section-title"><mat-icon>settings</mat-icon>Config</span>
        <span aria-hidden="true">{{ section === 'config' ? '⌃' : '⌄' }}</span>
      </button>
      <div id="admin-config-content" class="admin-section-content" [hidden]="section !== 'config'">
        <rdio-scanner-admin-config #configComponent></rdio-scanner-admin-config>
      </div>
    </section>

    <section class="admin-section">
      <button
        type="button"
        class="admin-section-header"
        [attr.aria-expanded]="section === 'logs'"
        aria-controls="admin-logs-content"
        (click)="toggleSection('logs')"
      >
        <span class="admin-section-title"><mat-icon>article</mat-icon>Logs</span>
        <span aria-hidden="true">{{ section === 'logs' ? '⌃' : '⌄' }}</span>
      </button>
      <div id="admin-logs-content" class="admin-section-content" [hidden]="section !== 'logs'">
        <rdio-scanner-admin-logs #logsComponent></rdio-scanner-admin-logs>
      </div>
    </section>

    <section class="admin-section">
      <button
        type="button"
        class="admin-section-header"
        [attr.aria-expanded]="section === 'tools'"
        aria-controls="admin-tools-content"
        (click)="toggleSection('tools')"
      >
        <span class="admin-section-title"><mat-icon>build</mat-icon>Tools</span>
        <span aria-hidden="true">{{ section === 'tools' ? '⌃' : '⌄' }}</span>
      </button>
      <div id="admin-tools-content" class="admin-section-content" [hidden]="section !== 'tools'">
        <rdio-scanner-admin-tools #toolsComponent (config)="openConfig($event)"></rdio-scanner-admin-tools>
      </div>
    </section>

    <button type="button" class="admin-section-header admin-logout" (click)="logout()">
      <span class="admin-section-title"><mat-icon>logout</mat-icon>Logout</span>
    </button>
  </div>
}
